.panel,.modal{background:linear-gradient(155deg,#fffdfa,#fff4eb);border:3px solid white;box-shadow:0 10px 30px #b18a7635}
.title{color:#915e4d;text-shadow:0 2px 0 #fff}.btn{border-radius:100px;background:linear-gradient(180deg,#ffb34b,#ff931f 76%,#e97812);box-shadow:inset 0 2px 1px #fff8,0 5px 0 #d8791b,0 9px 18px #df914855;text-shadow:0 1px 1px #9c5e3655;font-size:16px}
.btn.secondary{background:linear-gradient(#fffaf9,#f9e7e9);color:#91656e;box-shadow:0 4px 8px #d7b3b133;text-shadow:none}.round{background:#fff;box-shadow:0 5px 12px #b77f6840;border-radius:50%}
.sloth-hero{width:175px;height:175px;object-fit:contain;border-radius:50%;border:7px solid #fff5;filter:drop-shadow(0 8px 8px #90674a3b)}.sloth-sad{filter:grayscale(.4) drop-shadow(0 5px 5px #7b6b6540);transform:rotate(-8deg)}
.boardframe{background:#fff;border:5px solid #fff;border-radius:24px;padding:7px;box-shadow:0 9px 20px #9e7a6a35}.board{border:0;border-radius:15px;gap:2px;background:#fff;overflow:hidden}.cell{border:0!important;border-radius:6px;background:var(--tile);box-shadow:inset 0 -3px 0 #00000010,inset 0 2px 0 #ffffff30}.cell .animal{width:88%;height:88%;object-fit:cover;border-radius:50%;border:2px solid #fff8;box-shadow:0 2px 5px #69443d55}.cell .cross{font-size:clamp(20px,6vw,38px);line-height:1;color:#fff;text-shadow:0 2px 1px #6b4a4750;font-weight:1000}.cell .wrong{color:#ff593a;text-shadow:0 2px 0 #fff}

/* V5 LEAF GARDEN: original botanical puzzle board, not a square tile clone. */
.boardframe{position:relative;padding:17px 11px 12px;margin-top:14px;border:3px solid #f6e7c9;border-radius:34px;background:linear-gradient(155deg,#fff9e9,#f1e4c8 48%,#e6d5b3);box-shadow:inset 0 3px 0 #fffaf0,0 12px 0 #c6a880,0 19px 28px #8a674f38}
.boardframe:before{content:'✿  HALEY’S LEAF GARDEN  ✿';display:block;text-align:center;font-size:10px;font-weight:1000;letter-spacing:2.2px;color:#947e5a;padding:0 0 11px;text-shadow:0 1px #fff}
.board{border:3px solid #a5b77e;border-radius:24px;padding:5px;gap:3px;background:radial-gradient(circle at 30% 25%,#f8f5d7,#d7e7b4 65%,#b3c98e);box-shadow:inset 0 3px 9px #69865355,0 2px 0 #fff9;overflow:hidden}
.cell{border:0!important;overflow:visible;isolation:isolate;border-radius:42% 11% 42% 11%;transform:rotate(-2deg) scale(.96);background:linear-gradient(145deg,#ffffff55,transparent 45%),var(--tile);box-shadow:inset 2px 3px 1px #ffffff85,inset -3px -4px 0 #4b553020,2px 3px 0 #60764a35;transition:transform .12s,filter .12s}
.cell:nth-child(3n+2){border-radius:11% 42% 11% 42%;transform:rotate(2deg) scale(.96)}
.cell:nth-child(4n){transform:rotate(-3deg) scale(.94)}
.cell:before{content:'';position:absolute;inset:16% 47% 15% 47%;border-radius:100%;background:#ffffff38;transform:rotate(-39deg);pointer-events:none}
.cell:after{content:'';position:absolute;width:27%;height:27%;bottom:5%;right:5%;border-right:1px solid #54633b42;transform:rotate(-34deg);pointer-events:none}
.cell .animal{position:relative;z-index:1;width:87%;height:87%;border-radius:50%;border:2px solid #fff7db;box-shadow:0 2px 0 #8c714e,0 3px 7px #59402f55;background:#fff2c8}
.cell .cross{position:relative;z-index:1;color:#fffaf1;font-size:clamp(15px,5.2vw,31px);font-weight:1000;text-shadow:0 2px 1px #73564e8a}
.cell .wrong{z-index:2}.cell.hinted{box-shadow:inset 0 0 0 3px #ffe66c,0 0 8px #ffdb58}
.cell:active{transform:scale(.87) rotate(0deg)}
@media(max-width:390px){.boardframe{padding:12px 7px 9px}.board{gap:2px;padding:3px}.boardframe:before{font-size:9px;letter-spacing:1.3px}}

function audioReady(){if(state.settings.mute)return null;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch{return null}}function tone(freq,dur=.11,type='sine',vol=.12,delay=0){let a=audioReady();if(!a)return;let o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0001,vol*state.settings.sfx/100),t+.018);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.01)}function sfx(kind){if(kind==='tap')tone(420,.065,'sine',.07);if(kind==='x')tone(280,.06,'triangle',.05);if(kind==='bad'){tone(210,.16,'triangle',.14);tone(150,.19,'triangle',.12,.13)}if(kind==='clear'){[659,784,988].forEach((n,i)=>tone(n,.21,'sine',.11,i*.09))}if(kind==='win'){[523,659,784,1046].forEach((n,i)=>tone(n,.24,'sine',.15,i*.14))}}const themeNotes=[[261,329,392,523,392,329],[392,440,523,659,523,440],[220,261,329,392,329,261],[293,349,440,349,293,261],[523,587,659,784,659,587]];function startMusic(){stopMusic();if(state.settings.mute||!state.settings.music)return;musicStep=0;musicTimer=setInterval(()=>{if(document.hidden||state.settings.mute||!state.settings.music)return;let a=audioReady();if(!a)return;let notes=themeNotes[state.theme]||themeNotes[0],f=notes[musicStep++%notes.length];let o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(state.settings.music/100*.045,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.5)},520)}function stopMusic(){clearInterval(musicTimer);musicTimer=null}document.addEventListener('visibilitychange',()=>{if(document.hidden)stopMusic();else if(currentPage==='game')startMusic()});
function showHome(){currentPage='home';$('game').classList.add('hidden');$('home').classList.remove('hidden');$('levelInfo').textContent=`Puzzle ${state.level} • ${state.completed} solved • No timer`;updateHeader();setQuote();stopMusic();save()}function pickPuzzle(){let n=state.level===1?4:state.level===2?5:[4,5,6,7,8,9][rand(6)];let pool=PUZZLES[n],available=pool.filter(p=>!state.seen.includes(p.id));if(!available.length){state.seen=state.seen.filter(id=>!id.startsWith(n+'-'));available=pool}let p=available[rand(available.length)];state.puzzle=p;state.seen.push(p.id);state.marks=Array(n*n).fill(0);state.wrong=[];state.lives=4;state.hints=3;state.history=[];state.cleared=[];state.mode='sloth';save()}function showGame(){if(!state.puzzle)pickPuzzle();currentPage='game';$('home').classList.add('hidden');$('game').classList.remove('hidden');render();startMusic()}
function solvedRow(r){let n=state.puzzle.n;return state.marks[r*n+state.puzzle.solution[r]]===1&&Array.from({length:n},(_,c)=>c).every(c=>c===state.puzzle.solution[r]||state.marks[r*n+c]===2)}function solvedCol(c){let n=state.puzzle.n;return Array.from({length:n},(_,r)=>r).every(r=>state.puzzle.solution[r]===c?state.marks[r*n+c]===1:state.marks[r*n+c]===2)}function solvedRegion(k){let p=state.puzzle;return p.regions.every((region,i)=>region!==k||state.marks[i]===(Math.floor(i/p.n)===p.solution[Math.floor(i/p.n)]?1:2))}function regionId(i){return state.puzzle.regions[i]}function render(){let p=state.puzzle;if(!p)return;let n=p.n,b=$('board');b.style.gridTemplateColumns=`repeat(${n},1fr)`;b.innerHTML='';let solvedRows=0;for(let r=0;r<n;r++)if(solvedRow(r))solvedRows++;for(let i=0;i<n*n;i++){let r=Math.floor(i/n),c=i%n,region=p.regions[i],right=c<n-1&&p.regions[i+1]!==region,bottom=r<n-1&&p.regions[i+n]!==region,cell=document.createElement('button');cell.type='button';cell.className='cell'+(right?' right':'')+(bottom?' bottom':'');cell.style.setProperty('--tile',palette[region%palette.length]);cell.dataset.i=i;cell.setAttribute('aria-label',`Row ${r+1}, column ${c+1}, ${state.marks[i]===1?'sloth':state.marks[i]===2?'X':'empty'}`);if(state.marks[i]===1)cell.innerHTML=headSvg(false,'happy',r+c);else if(state.marks[i]===2)cell.innerHTML='<span class="cross">×</span>';if(state.wrong.includes(i))cell.innerHTML+='<span class="wrong">✕</span>';b.appendChild(cell)}$('score').textContent=state.score.toLocaleString();$('best').textContent=state.best.toLocaleString();$('completed').textContent=state.completed;$('puzzleTitle').textContent='Puzzle '+state.level;$('difficultyLabel').textContent=({4:'Easy',5:'Easy',6:'Medium',7:'Medium',8:'Hard',9:'Expert'})[n];$('lives').textContent='🍃'.repeat(state.lives)+'🤍'.repeat(4-state.lives);$('hint').textContent=`💡 Hint (${state.hints})`;$('hint').disabled=state.hints<=0;$('placeMode').classList.toggle('active',state.mode==='sloth');$('xMode').classList.toggle('active',state.mode==='x');$('rowProgress').style.width=(solvedRows/n*100)+'%';$('rowText').textContent=`${solvedRows} of ${n} rows fully marked`;save()}
function toast(message){let e=document.createElement('div');e.className='toast';e.textContent=message;$('toasts').appendChild(e);setTimeout(()=>e.remove(),1550)}function fly(points,from){let e=document.createElement('div');e.className='scorefly';e.textContent='+'+points;let rect=(from||$('board')).getBoundingClientRect(),target=$('scoreTarget').getBoundingClientRect();e.style.left=(rect.left+rect.width/2)+'px';e.style.top=(rect.top+rect.height/2)+'px';e.style.setProperty('--tx',(target.left+target.width/2)+'px');e.style.setProperty('--ty',(target.top+target.height/2)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),1100)}function points(n){state.score+=n;state.best=Math.max(state.score,state.best);fly(n);save();setTimeout(render,1020)}function snapshot(){state.history.push({marks:[...state.marks],wrong:[...state.wrong]});if(state.history.length>60)state.history.shift()}function wrongAt(i){if(state.wrong.includes(i))return;state.wrong.push(i);state.lives--;sfx('bad');toast('Oops! ✕  −1 leaf');render();if(state.lives<=0)setTimeout(showLoss,550)}function place(i,what){if(currentPage!=='game'||!state.puzzle||state.lives<=0)return;let p=state.puzzle,n=p.n,r=Math.floor(i/n),c=i%n,correct=c===p.solution[r];if(what===1&&!correct){wrongAt(i);return}snapshot();state.wrong=state.wrong.filter(x=>x!==i);state.marks[i]=state.marks[i]===what?0:what;sfx(what===1?'tap':'x');let fresh=[];for(let row=0;row<n;row++)if(solvedRow(row)&&!state.cleared.includes('r'+row)){state.cleared.push('r'+row);fresh.push('ROW CLEAR!')}for(let col=0;col<n;col++)if(solvedCol(col)&&!state.cleared.includes('c'+col)){state.cleared.push('c'+col);fresh.push('COLUMN CLEAR!')}for(let reg=0;reg<n;reg++)if(solvedRegion(reg)&&!state.cleared.includes('g'+reg)){state.cleared.push('g'+reg);fresh.push('REGION CLEAR!')}if(fresh.length){sfx('clear');toast(fresh.length>1?'EXCELLENT! ✨':fresh[0]);let value=fresh.length*({4:35,5:50,6:75,7:105,8:145,9:190}[n]||40);points(value)}render();if(Array.from({length:n},(_,row)=>row).every(solvedRow))setTimeout(showWin,1100)}
function onCell(i,forceX=false){let now=Date.now();let doubleTap=i===lastTap.i&&now-lastTap.t<340;lastTap={i,t:now};place(i,forceX||doubleTap||state.mode==='x'?2:1)}$('board').addEventListener('pointerdown',e=>{let cell=e.target.closest('.cell');if(!cell)return;swiping=true;onCell(Number(cell.dataset.i));});$('board').addEventListener('pointermove',e=>{if(!swiping||state.mode!=='x')return;let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(!el||!$('board').contains(el))return;let i=Number(el.dataset.i);if(state.marks[i]!==2)place(i,2)});window.addEventListener('pointerup',()=>swiping=false);$('board').addEventListener('contextmenu',e=>e.preventDefault());
function showModal(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden')}function closeModal(){$('overlay').classList.add('hidden')}function showLoss(){stopMusic();showModal(`<div class="broken">💔 🍂 ᶻᶻ</div><div class="bounce">${headSvg(true,'sad')}</div><h2>Out of Leaves!</h2><p>Even the sleepiest sloths have tough days. Try this puzzle again, Haley. ♡</p><div class="stack"><button class="btn wide" id="retry">Try Again 🍃</button><button class="btn secondary wide" id="loseHome">Home</button></div>`);$('retry').onclick=()=>{state.marks=Array(state.puzzle.n**2).fill(0);state.wrong=[];state.lives=4;state.hints=3;state.history=[];state.cleared=[];closeModal();showGame()};$('loseHome').onclick=()=>{closeModal();showHome()}}
const loveMessages=['Haley, you make ordinary days feel magical. ❤️','Your smile is still my favorite thing. ♡','I would choose you in every lifetime. ❤️','Every little adventure is better with you.','You deserve all the happiness in the world.','You make my world a softer place. ♡'];function unlockAchievement(id){if(!state.achievements.includes(id))state.achievements.push(id)}function showWin(){if(currentPage!=='game'||!$('overlay').classList.contains('hidden'))return;stopMusic();sfx('win');let n=state.puzzle.n,perfect=state.lives===4,base=({4:250,5:400,6:650,7:900,8:1250,9:1700})[n],accuracy=state.lives*35,bonus=rand(41),reward=base+accuracy+bonus;state.score+=reward;state.best=Math.max(state.best,state.score);state.completed++;state.level++;unlockAchievement('first');if(perfect)unlockAchievement('perfect');if(n>=8)unlockAchievement('expert');if(state.completed>=10)unlockAchievement('ten');state.quotes.push((state.completed-1)%genreLines.length);let special=state.completed%10===0;if(special)state.love.push((state.completed/10-1)%loveMessages.length);let isF=state.completed===1;state.puzzle=null;save();let title=state.completed%2===0?'GOOD FUCKING JOB!':(['EXCELLENT!','AMAZING!','YOU DID IT!','SO PROUD OF YOU!'][rand(4)]);showModal(`<div class="sparkles">✨🌟✨</div><div class="bounce">${headSvg(true,'happy',state.completed)}</div><h2>${title}</h2><p>${isF?'You’re pretty amazing, Haley. ❤️':'You crushed that puzzle, '+escapeHtml(state.name)+'! ❤️'}</p><div class="panel" style="padding:10px"><div class="eyebrow">Puzzle reward</div><div style="font-size:30px;font-weight:1000;color:#e681a4">+${reward.toLocaleString()} ✨</div><small>Difficulty + accuracy + small surprise bonus</small></div>${special?`<div class="quote">💌 Secret message unlocked!<br>${escapeHtml(loveMessages[state.love.at(-1)])}</div>`:''}<p class="tiny">📚 New quote card unlocked!</p><div class="stack"><button class="btn wide" id="nextPuzzle">Next Puzzle 🦥</button><button class="btn secondary wide" id="winHome">Home</button></div>`);$('nextPuzzle').onclick=()=>{closeModal();pickPuzzle();showGame()};$('winHome').onclick=()=>{closeModal();showHome()}}
function hint(){if(state.hints<=0)return;let p=state.puzzle,n=p.n,candidates=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++){let i=r*n+c;if(state.marks[i]===0&&c!==p.solution[r])candidates.push(i)}if(!candidates.length){toast('No more squares to eliminate!');return}let i=candidates[rand(candidates.length)];state.hints--;snapshot();state.marks[i]=2;sfx('clear');render();let cell=$('board').children[i];cell.classList.add('hinted');toast('One impossible spot marked ✕')}
function openProfile(){let a=animals.map((x,i)=>`<button class="animalpick ${i===state.animal?'selected':''}" data-animal="${i}">${x[0]}<small>${x[1]}</small></button>`).join('');let f=frames.map((x,i)=>`<button aria-label="Frame ${i+1}" class="framepick ${i===state.frame?'selected':''}" data-frame="${i}" style="--frame:${x}">✨</button>`).join('');showModal(`<h2>My Profile 🐾</h2><p>Make it yours, Haley!</p><input id="nameInput" maxlength="20" value="${escapeHtml(state.name)}" style="width:100%;padding:13px;border:2px solid #f0cfdb;border-radius:14px;background:#fff;font-weight:900;text-align:center"><h3 class="section">Choose your animal</h3><div class="gridanimals">${a}</div><h3 class="section">Choose your frame</h3><div class="frames">${f}</div><div style="height:15px"></div><button class="btn wide" id="profileSave">Save Profile ♡</button><button class="btn secondary wide" id="profileClose" style="margin-top:8px">Close</button>`);$('modal').querySelectorAll('[data-animal]').forEach(b=>b.onclick=()=>{state.animal=+b.dataset.animal;$('modal').querySelectorAll('[data-animal]').forEach(x=>x.classList.toggle('selected',x===b))});$('modal').querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{state.frame=+b.dataset.frame;$('modal').querySelectorAll('[data-frame]').forEach(x=>x.classList.toggle('selected',x===b))});$('profileSave').onclick=()=>{state.name=$('nameInput').value.trim()||'Haley';save();updateHeader();closeModal()};$('profileClose').onclick=()=>{save();updateHeader();closeModal()}}
function openCollection(){let cards=state.quotes.map(i=>genreLines[i%genreLines.length]).map(([g,q])=>`<div class="collect"><strong>📖 ${g}</strong>“${escapeHtml(q)}”<br><small>Original genre-inspired line</small></div>`).join('');let letters=state.love.map(i=>`<div class="collect"><strong>💌 A note for Haley</strong>${escapeHtml(loveMessages[i%loveMessages.length])}</div>`).join('');showModal(`<h2>Haley's Library 📚</h2><p>Little treasures you earn by solving puzzles.</p><h3 class="section">Quote cards (${state.quotes.length})</h3><div class="collection">${cards||'<div class="collect">Complete your first puzzle to unlock a quote!</div>'}</div><h3 class="section">Love notes (${state.love.length})</h3><div class="collection">${letters||'<div class="collect">A surprise arrives every 10 puzzles. ❤️</div>'}</div><p class="notice">These are original lines inspired by popular genres, not quotations from published books.</p><button class="btn wide" id="closeLibrary">Done</button>`);$('closeLibrary').onclick=closeModal}
function applyTheme(){let t=themes[state.theme]||themes[0];document.documentElement.style.setProperty('--bg',t[1]);document.documentElement.style.setProperty('--board',t[2])}function openThemes(){let items=themes.map(([name,bg],i)=>`<button class="themebtn ${i===state.theme?'selected':''}" data-theme="${i}" style="--sample:${bg}">${['🌳','🌸','🌙','🍁','❄️'][i]}<br>${name}<br><small>${state.unlockedThemes.includes(i)?'Unlocked':`Unlock at ${i*5} puzzles`}</small></button>`).join('');showModal(`<h2>Board Themes 🎨</h2><p>Unlock cozy new places as you play.</p><div class="themes">${items}</div><p class="notice">Every theme has its own gentle jingle.</p><button class="btn wide" id="themeDone">Done</button>`);$('modal').querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{let i=+b.dataset.theme;if(!state.unlockedThemes.includes(i)){toast('Keep solving to unlock!');return}state.theme=i;applyTheme();save();closeModal();openThemes();if(currentPage==='game')startMusic()});$('themeDone').onclick=closeModal}
function openAchievements(){let data=[['first','First Nap','Complete your first puzzle'],['perfect','Perfect Paws','Finish a puzzle without losing a leaf'],['expert','Big Brain Sloth','Complete a Hard or Expert puzzle'],['ten','Cozy Champion','Complete 10 puzzles']];showModal(`<h2>Achievements 🏆</h2><p>Every little win counts!</p><div class="stack">${data.map(([id,title,desc])=>`<div class="collect"><strong>${state.achievements.includes(id)?'🏅':'🔒'} ${title}</strong>${desc}</div>`).join('')}</div><div style="height:12px"></div><button class="btn wide" id="awardDone">Done</button>`);$('awardDone').onclick=closeModal}
function openSettings(){let s=state.settings;showModal(`<h2>Sound & Settings 🎶</h2><p>Cute jingles for every map. Make them as quiet as you like.</p><div class="settingsrow"><label>🔇 Mute everything</label><input type="checkbox" id="muteToggle" ${s.mute?'checked':''}></div><div class="settingsrow"><label>🎵 Music <span id="musicValue">${s.music}%</span></label><input type="range" id="musicVolume" min="0" max="100" value="${s.music}"></div><div class="settingsrow"><label>✨ Sound effects <span id="sfxValue">${s.sfx}%</span></label><input type="range" id="sfxVolume" min="0" max="100" value="${s.sfx}"></div><div class="settingsrow"><label>📱 Respect Silent Mode when supported</label><input type="checkbox" id="silentToggle" ${s.respectSilent?'checked':''}></div><p class="notice">iPhone browsers do not reliably expose the physical Silent switch to websites, so automatic muting from that switch cannot be guaranteed. In-game mute always works. Audio starts after you interact with the game.</p><button class="btn wide" id="settingsDone">Save Settings</button>`);$('muteToggle').onchange=e=>{s.mute=e.target.checked;save();if(s.mute)stopMusic();else if(currentPage==='game')startMusic()};$('musicVolume').oninput=e=>{s.music=+e.target.value;$('musicValue').textContent=s.music+'%';save();if(currentPage==='game')startMusic()};$('sfxVolume').oninput=e=>{s.sfx=+e.target.value;$('sfxValue').textContent=s.sfx+'%';save();sfx('tap')};$('silentToggle').onchange=e=>{s.respectSilent=e.target.checked;save()};$('settingsDone').onclick=closeModal}
$('play').onclick=showGame;$('homeButton').onclick=showHome;$('profileChip').onclick=openProfile;$('settingsButton').onclick=openSettings;$('hint').onclick=hint;$('placeMode').onclick=()=>{state.mode='sloth';render()};$('xMode').onclick=()=>{state.mode='x';render()};$('undo').onclick=()=>{let h=state.history.pop();if(!h){toast('Nothing to undo');return}state.marks=h.marks;state.wrong=h.wrong;render();sfx('x')};$('erase').onclick=()=>{state.mode='x';toast('Tap an X to erase it');render()};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>({profile:openProfile,collection:openCollection,themes:openThemes,achievements:openAchievements}[b.dataset.page])());for(let i=1;i<themes.length;i++)if(state.completed>=i*5&&!state.unlockedThemes.includes(i))state.unlockedThemes.push(i);let oldShowWin=showWin;showWin=function(){oldShowWin();for(let i=1;i<themes.length;i++)if(state.completed>=i*5&&!state.unlockedThemes.includes(i)){state.unlockedThemes.push(i);save()}};applyTheme();showHome();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
