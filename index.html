const themes=[['Cozy Forest','#90ba75','#d2edb6','linear-gradient(115deg,#3d8655,#9bd18b 60%,#cde6a2)'],['Pink Sunset','#e6a4b9','#f8d7d5','linear-gradient(115deg,#a95493,#f0a3b7 65%,#ffd4ac)'],['Midnight Purple','#9180b9','#c8b8ed','linear-gradient(115deg,#38336b,#8467b9 65%,#d0b7ed)'],['Autumn Leaves','#e7b27d','#f4d4a2','linear-gradient(115deg,#9b4f26,#e9a044 65%,#ffdf94)'],['Winter Wonderland','#b2d6e5','#e0f0f6','linear-gradient(115deg,#658fbd,#a9d7e8 65%,#f5f8ff)'],['Dreamy Clouds','#c6a9d9','#e7d7f2','linear-gradient(115deg,#8576c3,#d8b9e7 65%,#ffdeef)']];const colors=['#f5a6c5','#6ac8c6','#ffa970','#a78cde','#75b8e9','#f3cf6c','#b67c57','#b7d7a1','#f18db6','#9bbddc'];const quotes=[['Romance','Some stories stay with you forever.'],['Romantasy','Even the stars knew her heart was brave.'],['Thriller','Every secret has a shadow.'],['Dark romance','Not every beautiful thing is harmless.'],['Fantasy','The impossible was only the beginning.'],['Romance','She found magic in the ordinary moments.'],['Thriller','The quietest room held the loudest truth.'],['Romantasy','Some promises outlast kingdoms.']];const notes=['You make ordinary days feel magical.','Your smile is still my favorite thing.','I would choose you in every lifetime.','Every little adventure is better with you.','You deserve all the happiness in the world.','You make my world a softer place.'];const key='slothdoku_haley_v6';let state={name:'',animal:0,frame:0,level:1,completed:0,score:0,best:0,theme:0,used:[],quotes:[],notes:[],awards:[],puzzle:null,marks:[],lives:4,hints:3,cleared:[],settings:{mute:false,music:45,sfx:75,respectSilent:true}};try{let old=JSON.parse(localStorage.getItem(key));if(old)state={...state,...old,settings:{...state.settings,...old.settings}}}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}let page='home',audio=null,musicLoop=null,musicStep=0;function audioCtx(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(freq,dur=.12,vol=.05,when=0,type='sine'){if(state.settings.mute)return;try{let a=audioCtx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(Math.max(.0001,vol),a.currentTime+when);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+when+dur);o.connect(g);g.connect(a.destination);o.start(a.currentTime+when);o.stop(a.currentTime+when+dur+.01)}catch(e){}}function sfx(type){let v=state.settings.sfx/100;if(type==='tap')tone(390,.09,.035*v);if(type==='x')tone(480,.08,.028*v);if(type==='wrong'){tone(210,.18,.08*v);tone(145,.22,.06*v,.12)}if(type==='clear'){[520,690,870].forEach((f,i)=>tone(f,.23,.07*v,i*.09))}if(type==='win'){[390,520,660,780,1040].forEach((f,i)=>tone(f,.35,.07*v,i*.13))}}const melodies=[[392,523,587,659,523,440,392,330],[440,554,659,554,494,440,392,330],[293,349,440,392,349,293,261,220],[392,440,523,440,392,349,330,293],[523,659,784,659,587,523,440,392],[349,440,523,587,523,440,392,349]];function startMusic(){stopMusic();if(state.settings.mute||state.settings.music===0||page!=='game')return;musicLoop=setInterval(()=>{if(document.hidden)return;let f=melodies[state.theme][musicStep++%8];tone(f,.38,.018*state.settings.music/100,0,'sine')},580)}function stopMusic(){if(musicLoop)clearInterval(musicLoop);musicLoop=null}function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),1400)}function modal(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden')}function close(){ $('overlay').classList.add('hidden') }function header(){ $('logo').innerHTML=`Sl${'<span class="logoface">'+slothSvg()+'</span>'}thdoku`;$('profileChip').classList.toggle('hidden',!state.name);$('profileChip').innerHTML=avatar(state.animal,state.frame)+`<span>${esc(state.name||'')}</span>`;$('profileChip').onclick=openProfile;$('settingsTop').innerHTML=ico('settings');$('settingsTop').onclick=openSettings}function applyTheme(){document.documentElement.style.setProperty('--forest',themes[state.theme][2])}function setPage(p){page=p;stopMusic();header();applyTheme();$('main').className='fade'}function home(){setPage('home');$('main').innerHTML=`<section class="hero"><img src="sloth-hero.jpg" alt="Sleeping illustrated sloth on a branch"><h1>Welcome to Slothdoku</h1><p>Made just for Haley</p><button class="btn wide" id="play">${state.puzzle?'Continue Puzzle':'Play'}</button></section><div class="menu">${[['calendar','Daily Challenge','daily'],['paint','Themes','themes'],['profile','Profile','profile'],['book','Quotes','quotes'],['award','Achievements','awards'],['bag','Collection','collection']].map(([ic,label,id])=>`<button class="menubtn" data-open="${id}">${ico(ic)} ${label}</button>`).join('')}</div><p class="footnote">Take your time. There is no timer.</p>`;$('play').onclick=game;$('main').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSection(b.dataset.open))}
function choosePuzzle(){let n=state.level<=2?4:([4,5,5,6,6,7,7,8,9][Math.floor(Math.random()*9)]);let bank=window.PUZZLES[String(n)]||window.PUZZLES['4'];let available=bank.filter(p=>!state.used.includes(p.id));if(!available.length){state.used=state.used.filter(id=>!bank.some(p=>p.id===id));available=bank}let p=available[Math.floor(Math.random()*available.length)];state.used.push(p.id);state.puzzle=p;state.marks=Array(n*n).fill(0);state.lives=4;state.hints=3;state.cleared=[];save()}function difficulty(n){return n<=4?'Easy':n<=5?'Medium':n<=7?'Hard':'Expert'}function rules(){return `<div class="rules"><div class="rule">${ico('bag')}One sloth per color</div><div class="rule">${ico('profile')}One per row and column</div><div class="rule">${ico('light')}Sloths cannot touch</div></div>`}function game(){if(!state.name){openProfile(true);return}if(!state.puzzle)choosePuzzle();setPage('game');renderGame();startMusic()}function renderGame(){let p=state.puzzle,n=p.n;let tiles=p.regions.map((region,i)=>{let mark=state.marks[i];return `<div class="tile" data-i="${i}" style="--tile:${colors[region%colors.length]}"><span class="vein"></span>${mark===1?cross():mark===2?`<div class="sloth">${slothSvg()}</div>`:''}</div>`}).join('');$('main').innerHTML=`<div class="pagehead"><button class="iconbtn" id="goHome" aria-label="Home">${ico('home')}</button><div class="label"><small>PUZZLE ${state.level}</small>${difficulty(n)}</div><button class="iconbtn" id="gear" aria-label="Settings">${ico('settings')}</button></div><div class="stats"><div class="stat"><small>SCORE</small><strong id="score">${state.score.toLocaleString()}</strong></div><div class="stat"><small>BEST</small><strong>${state.best.toLocaleString()}</strong></div><div class="stat"><small>PUZZLES</small><strong>${state.completed}</strong></div></div>${rules()}<div class="garden"><div class="gardenname">HALEY'S LEAF GARDEN</div><div class="board" id="board" style="grid-template-columns:repeat(${n},1fr)">${tiles}</div></div><div class="controls"><div class="lives" aria-label="${state.lives} leaves remaining">${Array.from({length:4},(_,i)=>leaf(i<state.lives)).join('')}</div><button class="hint" id="hint">${ico('light',19)} Hint (${state.hints})</button></div><div class="instructions">Tap to mark or remove an X. Double-tap to place a sloth.<br>Swipe to mark a row or column. No timer.</div>`;$('goHome').onclick=home;$('gear').onclick=openSettings;$('hint').onclick=hint;attachBoard()}
let down=null,lastTap={i:-1,t:0},pending=null,gestureSwiped=false;function attachBoard(){const board=$('board');board.onpointerdown=e=>{let tile=e.target.closest('.tile');if(!tile)return;down={i:+tile.dataset.i,x:e.clientX,y:e.clientY,id:e.pointerId,visited:new Set([+tile.dataset.i])};gestureSwiped=false;board.setPointerCapture(e.pointerId)};board.onpointermove=e=>{if(!down)return;let dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>9){gestureSwiped=true;if(pending){clearTimeout(pending);pending=null}let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');if(el&&board.contains(el)){let i=+el.dataset.i;if(!down.visited.has(i)){let n=state.puzzle.n,from=[Math.floor(down.i/n),down.i%n],to=[Math.floor(i/n),i%n];if(from[0]===to[0]||from[1]===to[1]){let count=Math.max(Math.abs(to[0]-from[0]),Math.abs(to[1]-from[1]));for(let k=0;k<=count;k++){let r=from[0]+Math.sign(to[0]-from[0])*k,c=from[1]+Math.sign(to[1]-from[1])*k,j=r*n+c;if(!down.visited.has(j)){down.visited.add(j);markX(j,true)}}}else{down.visited.add(i);markX(i,true)}}}if(down.visited.size===1)markX(down.i,true)}};board.onpointerup=e=>{if(!down)return;let i=down.i;down=null;if(gestureSwiped){save();checkClears();return}let t=Date.now();if(lastTap.i===i&&t-lastTap.t<340){if(pending){clearTimeout(pending);pending=null}lastTap={i:-1,t:0};placeSloth(i)}else{lastTap={i,t};pending=setTimeout(()=>{pending=null;if(page==='game')markX(i,false)},345)}};board.onpointercancel=()=>{down=null};board.oncontextmenu=e=>e.preventDefault()}
function updateTile(i){let p=state.puzzle;if(!p)return;let el=$('board')?.children[i];if(!el)return;el.innerHTML=`<span class="vein"></span>${state.marks[i]===1?cross():state.marks[i]===2?`<div class="sloth">${slothSvg()}</div>`:''}`};function markX(i,swipe){if(page!=='game'||!state.puzzle||state.marks[i]===2)return;if(swipe){if(state.marks[i]===1)return;state.marks[i]=1}else state.marks[i]=state.marks[i]===1?0:1;updateTile(i);sfx('x');save();checkClears()};function placeSloth(i){if(page!=='game'||!state.puzzle||state.marks[i]===2)return;let n=state.puzzle.n,r=Math.floor(i/n),c=i%n;if(state.puzzle.solution[r]!==c){state.lives--;sfx('wrong');let el=$('board').children[i],old=el.innerHTML;el.innerHTML=`<span class="vein"></span>${cross(true)}`;setTimeout(()=>{if(page==='game'&&state.puzzle&&$('board')?.children[i]===el)updateTile(i)},700);save();if(state.lives<=0)setTimeout(lose,850);else{let leaves=document.querySelector('.lives');if(leaves)leaves.innerHTML=Array.from({length:4},(_,j)=>leaf(j<state.lives)).join('')}return}state.marks[i]=2;updateTile(i);sfx('clear');save();checkClears();if(state.puzzle&&state.puzzle.solution.every((c,r)=>state.marks[r*n+c]===2))setTimeout(win,650)}function checkClears(){if(!state.puzzle)return;let p=state.puzzle,n=p.n,done=[];for(let r=0;r<n;r++)if(Array.from({length:n},(_,c)=>state.marks[r*n+c]).every(Boolean))done.push('r'+r);for(let c=0;c<n;c++)if(Array.from({length:n},(_,r)=>state.marks[r*n+c]).every(Boolean))done.push('c'+c);for(let k=0;k<n;k++)if(p.regions.every((v,i)=>v!==k||state.marks[i]))done.push('g'+k);let fresh=done.filter(x=>!state.cleared.includes(x));if(fresh.length){state.cleared.push(...fresh);state.score+=fresh.length*40;state.best=Math.max(state.best,state.score);$('score').textContent=state.score.toLocaleString();toast('CLEAR!');sfx('clear');save()}}function hint(){if(!state.puzzle||state.hints<=0)return;let p=state.puzzle,n=p.n,choices=[];for(let i=0;i<n*n;i++)if(state.marks[i]===0&&p.solution[Math.floor(i/n)]!==i%n)choices.push(i);if(!choices.length){toast('All clear!');return}state.hints--;let i=choices[Math.floor(Math.random()*choices.length)];markX(i,true);$('hint').innerHTML=`${ico('light',19)} Hint (${state.hints})`;let el=$('board').children[i];el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),600)}function lose(){if(page!=='game'||!state.puzzle)return;stopMusic();modal(`<div class="bigchar">${slothSvg('sad')}</div><h2>Out of Leaves!</h2><p>Even the sleepiest sloths have tough days. Try this puzzle again.</p><button class="btn wide" id="retry">Try Again</button><button class="btn pale wide" id="toHome" style="margin-top:12px">Home</button>`);$('retry').onclick=()=>{state.marks=Array(state.puzzle.n**2).fill(0);state.lives=4;state.hints=3;state.cleared=[];save();close();game()};$('toHome').onclick=()=>{close();home()}}function win(){if(page!=='game'||!state.puzzle)return;stopMusic();sfx('win');let n=state.puzzle.n,base=({4:300,5:550,6:850,7:1250,8:1800,9:2500})[n]||300;let reward=base+state.lives*60+Math.floor(Math.random()*30);state.score+=reward;state.best=Math.max(state.score,state.best);state.completed++;state.level++;let first=state.completed===1;if(!state.awards.includes('first'))state.awards.push('first');if(state.lives===4&&!state.awards.includes('perfect'))state.awards.push('perfect');if(n>=8&&!state.awards.includes('expert'))state.awards.push('expert');if(state.completed>=10&&!state.awards.includes('ten'))state.awards.push('ten');state.quotes.push((state.completed-1)%quotes.length);if(state.completed%10===0)state.notes.push((state.completed/10-1)%notes.length);state.puzzle=null;save();let msg=state.completed%2===0?'GOOD FUCKING JOB!':['Excellent!','Amazing!','You Did It!','Persevered!'][state.completed%4];modal(`<div class="bigchar">${slothSvg()}</div><h2>${msg}</h2><p>${first?"You're pretty amazing, Haley.":`You did it, ${esc(state.name)}!`}</p><div class="panel"><strong style="font-size:28px;color:#ef9a35">+${reward.toLocaleString()} points</strong><div style="font-size:12px;color:#a48278">Difficulty and accuracy reward</div></div>${state.completed%10===0?`<div class="panel"><strong>A secret note unlocked!</strong><p>${esc(notes[state.notes.at(-1)])}</p></div>`:''}<p>New quote card unlocked.</p><button class="btn wide" id="next">Next Puzzle</button><button class="btn pale wide" id="toHome" style="margin-top:12px">Home</button>`);$('next').onclick=()=>{close();game()};$('toHome').onclick=()=>{close();home()}}
function openProfile(first=false){let selA=state.animal,selF=state.frame;let markup=()=>`<h2>${first?'Create Your Profile':'My Profile'}</h2><p>Choose a name, animal, and a decorative frame.</p><input class="nameinput" id="nameInput" maxlength="20" placeholder="Type your name" value="${esc(state.name)}"><div class="section">Choose Your Animal</div><div class="animalgrid">${animalNames.map((a,i)=>`<button class="pick ${i===selA?'selected':''}" data-animal="${i}">${animalSvg(i)}<small>${a}</small></button>`).join('')}</div><div class="section">Choose Your Frame</div><div class="framegrid">${Array.from({length:8},(_,i)=>`<button class="framepick ${i===selF?'selected':''}" data-frame="${i}" aria-label="Frame ${i+1}">${avatar(selA,i)}</button>`).join('')}</div><button class="btn wide" id="saveProfile" style="margin-top:20px">${first?'Create Profile':'Save Profile'}</button>${!first?'<button class="btn pale wide" id="closeProfile" style="margin-top:12px">Cancel</button>':''}`;modal(markup());function wire(){ $('modal').querySelectorAll('[data-animal]').forEach(b=>b.onclick=()=>{let value=$('nameInput').value;selA=+b.dataset.animal;$('modal').innerHTML=markup();$('nameInput').value=value;wire()});$('modal').querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{let value=$('nameInput').value;selF=+b.dataset.frame;$('modal').innerHTML=markup();$('nameInput').value=value;wire()});$('saveProfile').onclick=()=>{let name=$('nameInput').value.trim();if(!name){$('nameInput').focus();toast('Enter a name');return}state.name=name;state.animal=selA;state.frame=selF;save();close();header();if(first)game()};if($('closeProfile'))$('closeProfile').onclick=close}wire()}
function openSection(section){if(section==='profile')return openProfile();if(section==='daily')return modal(`<h2>Daily Challenge</h2><p>A new cozy puzzle every day. For now, enjoy the main puzzles while we prepare daily challenges.</p><button class="btn wide" onclick="document.getElementById('overlay').classList.add('hidden')">Got it</button>`);if(section==='themes'){let html=themes.map(([name,bg,board,gradient],i)=>`<button class="themeitem" data-theme="${i}" style="--sample:${gradient}">${name}<small>${state.completed>=i*5?(state.theme===i?'Selected':'Select'):`Unlock at ${i*5}`}</small></button>`).join('');modal(`<h2>Board Themes</h2><p>Unlock beautiful worlds by completing puzzles.</p>${html}<button class="btn pale wide" id="done">Done</button>`);$('modal').querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{let i=+b.dataset.theme;if(state.completed<i*5){toast('Keep playing to unlock');return}state.theme=i;save();applyTheme();close();openSection('themes')});$('done').onclick=close;return}if(section==='quotes'||section==='collection'){let q=state.quotes.map(i=>`<div class="card"><strong>${quotes[i][0]}</strong>${esc(quotes[i][1])}</div>`).join('');let n=state.notes.map(i=>`<div class="card"><strong>A note for Haley</strong>${esc(notes[i])}</div>`).join('');modal(`<h2>${section==='quotes'?'Quote Collection':'Your Collection'}</h2><p>Earn a new quote with every completed puzzle.</p><div class="cardgrid">${q||'<div class="card">Complete a puzzle to unlock your first card.</div>'}</div>${section==='collection'?`<div class="section">Secret Love Notes</div><div class="cardgrid">${n||'<div class="card">A surprise arrives every 10 puzzles.</div>'}</div>`:''}<p style="font-size:11px">Original genre-inspired writing, not published book quotations.</p><button class="btn wide" id="done">Done</button>`);$('done').onclick=close;return}if(section==='awards'){let items=[['first','First Nap','Complete your first puzzle'],['perfect','Perfect Paws','Solve without losing a leaf'],['expert','Big Brain Sloth','Finish an Expert puzzle'],['ten','Cozy Champion','Complete ten puzzles']];modal(`<h2>Achievements</h2><p>Little milestones worth celebrating.</p><div class="cardgrid">${items.map(([id,title,desc])=>`<div class="card"><strong>${state.awards.includes(id)?'Unlocked':'Locked'}: ${title}</strong>${desc}</div>`).join('')}</div><button class="btn wide" id="done" style="margin-top:15px">Done</button>`);$('done').onclick=close}}
function openSettings(){let s=state.settings;modal(`<h2>Sound & Settings</h2><p>Every theme has its own gentle little melody.</p><div class="setting"><label for="mute">Mute all sounds</label><input type="checkbox" id="mute" ${s.mute?'checked':''}></div><div class="setting"><label for="music">Background music <span id="musicLabel">${s.music}%</span></label><input type="range" id="music" min="0" max="100" value="${s.music}"></div><div class="setting"><label for="sfx">Sound effects <span id="sfxLabel">${s.sfx}%</span></label><input type="range" id="sfx" min="0" max="100" value="${s.sfx}"></div><div class="setting"><label for="silent">Respect Silent Mode when supported</label><input type="checkbox" id="silent" ${s.respectSilent?'checked':''}></div><p style="font-size:11px">iPhone browsers cannot reliably detect the physical Silent switch. In-game mute always works.</p><button class="btn wide" id="done">Save Settings</button>`);$('mute').onchange=e=>{s.mute=e.target.checked;save();if(s.mute)stopMusic();else startMusic()};$('music').oninput=e=>{s.music=+e.target.value;$('musicLabel').textContent=s.music+'%';save();startMusic()};$('sfx').oninput=e=>{s.sfx=+e.target.value;$('sfxLabel').textContent=s.sfx+'%';save();sfx('tap')};$('silent').onchange=e=>{s.respectSilent=e.target.checked;save()};$('done').onclick=close}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay')&&state.name)close()});header();applyTheme();home();if(!state.name)setTimeout(()=>openProfile(true),400);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
